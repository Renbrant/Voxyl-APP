name: Deploy API Worker

# Manual only. Runs against the protected "production" environment, so it can
# require a reviewer approval and only sees the Cloudflare secrets stored there.
on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending D1 migrations before deploying
        type: boolean
        default: true
      deploy_worker:
        description: Deploy the Worker after the checks pass
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Apply D1 migrations
        if: ${{ inputs.apply_migrations }}
        run: npx wrangler d1 migrations apply voxyl-db --remote --config workers/api/wrangler.toml
      - name: Deploy Worker
        if: ${{ inputs.deploy_worker }}
        run: npx wrangler deploy --config workers/api/wrangler.toml
