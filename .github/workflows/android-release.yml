name: Android Release Bundle

# Manual only. Runs against the protected "production" environment, so it can
# require a reviewer approval and only sees the Android release secrets stored there.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: production
    # contents: write is needed only to refresh the public "android-test" pre-release.
    permissions:
      contents: write
    env:
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check release secrets are present
        run: |
          missing=0
          for name in VITE_CLERK_PUBLISHABLE_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          case "$VITE_CLERK_PUBLISHABLE_KEY" in
            pk_live_*) ;;
            *) echo "VITE_CLERK_PUBLISHABLE_KEY must be the Clerk production key (pk_live_)"; exit 1 ;;
          esac

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web assets and sync Android
        run: |
          npm run build
          npx cap sync android

      - name: Decode upload keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release bundle and APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon

      - name: Verify signatures
        run: |
          aab=$(ls android/app/build/outputs/bundle/release/*.aab | head -n 1)
          jarsigner -verify "$aab"
          echo "AAB signing certificate:"
          keytool -printcert -jarfile "$aab" | grep -E "Owner|SHA256"
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          echo "APK signing certificate:"
          "$apksigner" verify --print-certs "$apk" | grep -E "SHA-256|Verifies"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload bundle, APK and mapping
        uses: actions/upload-artifact@v4
        with:
          name: voxyl-android-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish test APK to the android-test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          cp "$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)" "$RUNNER_TEMP/Voxyl-test.apk"
          # Only the APK is published. The AAB, mapping file and keystore stay private.
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test "$RUNNER_TEMP/Voxyl-test.apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Voxyl Android test build (v$version)" \
            --notes "Test build, version $version, commit ${GITHUB_SHA::7}. Signed release build published for testing before each Google Play upload; it may be unstable. Android may ask you to allow installation from unknown sources."
