name = "voxyl-api"
main = "src/index.ts"
compatibility_date = "2026-07-07"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "api.voxyl.renbrant.com", custom_domain = true }
]

[vars]
CLERK_AUTHORIZED_PARTIES = "http://127.0.0.1:5173,http://localhost:5173,https://localhost,capacitor://localhost,https://voxyl.renbrant.com,https://v.renbrant.com"
CLERK_ISSUER = "https://clerk.v.renbrant.com"
CLOUDFLARE_ACCOUNT_ID = "9631e486fffaa1a728cd33b34b6dd2b7"

[[d1_databases]]
binding = "DB"
database_name = "voxyl-db"
database_id = "7f54b56f-9df1-4c12-b685-9fc7af29f094"

[[kv_namespaces]]
binding = "VOXYL_CACHE"
id = "f343ebdd13a74e0881985824de684671"

[[r2_buckets]]
binding = "VOXYL_MEDIA"
bucket_name = "voxyl-media"

# Rate limits (Workers Rate Limiting API, requires Wrangler >= 4.36).
# Keys are the user id for authenticated requests and the client IP otherwise.
# Starting values; calibrate against real traffic before tightening.
[[ratelimits]]
name = "RL_PUBLIC"        # anonymous discovery reads, keyed by IP
namespace_id = "1001"
  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "RL_EXPENSIVE"     # podcast search, keyed by user or IP
namespace_id = "1002"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "RL_RSS"           # RSS fetch, keyed by user or IP; one playlist fetches every feed in it
namespace_id = "1004"
  [ratelimits.simple]
  limit = 300
  period = 60

[[ratelimits]]
name = "RL_WRITE"         # authenticated writes, keyed by user
namespace_id = "1003"
  [ratelimits.simple]
  limit = 30
  period = 60
